<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora da Água</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="card">
      <h1>Calculadora da Água</h1>
      <p class="subtitle">Uso consciente da água com um tema rosa delicado</p>

      <div class="calculator">
        <input type="text" id="display" value="0" readonly />

        <div class="buttons">
          <button class="special" onclick="clearDisplay()">C</button>
          <button class="special" onclick="appendValue('/')">÷</button>
          <button class="special" onclick="appendValue('*')">×</button>
          <button class="special" onclick="appendValue('-')">-</button>

          <button onclick="appendValue('7')">7</button>
          <button onclick="appendValue('8')">8</button>
          <button onclick="appendValue('9')">9</button>
          <button class="special" onclick="appendValue('+')">+</button>

          <button onclick="appendValue('4')">4</button>
          <button onclick="appendValue('5')">5</button>
          <button onclick="appendValue('6')">6</button>
          <button class="equal" onclick="calculateResult()">=</button>

          <button onclick="appendValue('1')">1</button>
          <button onclick="appendValue('2')">2</button>
          <button onclick="appendValue('3')">3</button>

          <button class="zero" onclick="appendValue('0')">0</button>
          <button onclick="appendValue('.')">.</button>
        </div>
      </div>

      <div class="tip">
        Economizar água é um gesto de carinho com o planeta.
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
